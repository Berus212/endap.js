
<!doctype html>
<html lang="id" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">
  <title>Analisis Gerak Parabola</title>
</head>

<body>

<script src="/libs/chartjs/4.5.1/chart.umd.min.js"></script>

<script type="importmap">
{
  "imports": {
    "endap": "/libs/endap/0.0.5/endap.min.js"
  }
}
</script>

<div id="cnt1"></div>

<script type="module">

import { Console as CLI } from "endap";
import { Tensor1D as T1D } from "endap";

// ========================================
// 1. LAYOUT
// ========================================

const cnt = document.getElementById("cnt1");

Object.assign(cnt.style, {
  display: "flex",
  flexDirection: "column",
  gap: "24px",
  width: "100%",
});

// ========================================
// 2. PARAMETER GERAK PARABOLA
// ========================================

const x0 = 0;
const y0 = 0;

const v0x = 20;
const v0y = 40;

const ax = 0;
const ay = -10;

const tbeg = 0;
const tend = 8;
const dt = 0.5;

// +1 agar titik waktu akhir ikut dihitung
const n = Math.round((tend - tbeg) / dt) + 1;

// ========================================
// 3. MENGHITUNG DATA POSISI
// ========================================

const tData = T1D.create(n);
const xData = T1D.create(n);
const yData = T1D.create(n);

for (let i = 0; i < n; i++) {
  const t = tbeg + i * dt;

  const x = x0 + v0x * t + 0.5 * ax * t * t;
  const y = y0 + v0y * t + 0.5 * ay * t * t;

  tData[i] = t;
  xData[i] = x;
  yData[i] = y;
}

// ========================================
// 4. MEMBENTUK DATA UNTUK TIGA GRAFIK
// ========================================

// data x-t: posisi horizontal terhadap waktu
const dataXT = T1D.create(n);

// data y-t: posisi vertikal terhadap waktu
const dataYT = T1D.create(n);

// data x-y: posisi vertikal terhadap horizontal
const dataXY = T1D.create(n);

for (let i = 0; i < n; i++) {
  dataXT[i] = {
    x: tData[i],
    y: xData[i],
  };

  dataYT[i] = {
    x: tData[i],
    y: yData[i],
  };

  dataXY[i] = {
    x: xData[i],
    y: yData[i],
  };
}

// ========================================
// 5. FUNGSI MEMBUAT CONSOLE
// ========================================

function createConsole(title, headers, rows) {
  const output = CLI.create("100%");
  output.setTitle(title);

  output.log(headers.join("\t"));

  for (const row of rows) {
    output.log(
      row.map(value => value.toFixed(3)).join("\t")
    );
  }

  return output.el;
}

const consoleXT = createConsole(
  "data x-t",
  ["t (s)", "x (m)"],
  Array.from(
    { length: n },
    (_, i) => [tData[i], xData[i]]
  )
);

const consoleYT = createConsole(
  "data y-t",
  ["t (s)", "y (m)"],
  Array.from(
    { length: n },
    (_, i) => [tData[i], yData[i]]
  )
);

const consoleXY = createConsole(
  "data x-y",
  ["x (m)", "y (m)"],
  Array.from(
    { length: n },
    (_, i) => [xData[i], yData[i]]
  )
);

// ========================================
// 6. FUNGSI MEMBUAT GRAFIK CHART.JS
// ========================================


function createChart(title, xlabel, ylabel, data) {
  const wrapper = document.createElement("div");

  Object.assign(wrapper.style, {
    position: "relative",
    flex: "2 1 350px",
    minWidth: "0",
    height: "320px",
    overflow: "hidden",
  });

  const canvas = document.createElement("canvas");

  Object.assign(canvas.style, {
    display: "block",
    width: "100%",
    height: "100%",
  });

  wrapper.append(canvas);

  new Chart(canvas, {
    type: "scatter",

    data: {
      datasets: [
        {
          label: title,
          data: data,
          radius: 4,
          hoverRadius: 6,
          showLine: true,
          borderWidth: 2,
        },
      ],
    },

    options: {
      responsive: true,
      maintainAspectRatio: false,

      plugins: {
        legend: {
          display: true,
        },
      },

      scales: {
        x: {
          type: "linear",
          title: {
            display: true,
            text: xlabel,
          },
        },

        y: {
          type: "linear",
          title: {
            display: true,
            text: ylabel,
          },
        },
      },
    },
  });

  return wrapper;
}


// ========================================
// 7. MEMBUAT PANEL GRAFIK
// ========================================


function createPanel(consoleElement, chartWrapper) {
  const panel = document.createElement("div");

  Object.assign(panel.style, {
    display: "flex",
    flexWrap: "wrap",
    alignItems: "flex-start",
    gap: "12px",
    width: "100%",
    minWidth: "0",
  });

  Object.assign(consoleElement.style, {
    flex: "1 1 220px",
    minWidth: "0",
    overflow: "auto",
  });

  panel.append(consoleElement, chartWrapper);

  return panel;
}


// Grafik 1: data x-t
const chartXT = createChart(
  "data x-t",
  "Waktu, t (s)",
  "Posisi horizontal, x (m)",
  dataXT
);

// Grafik 2: data y-t
const chartYT = createChart(
  "data y-t",
  "Waktu, t (s)",
  "Posisi vertikal, y (m)",
  dataYT
);

// Grafik 3: data x-y
const chartXY = createChart(
  "data x-y",
  "Posisi horizontal, x (m)",
  "Posisi vertikal, y (m)",
  dataXY
);

// ========================================
// 8. MENAMPILKAN SEMUA PANEL
// ========================================

cnt.append(
  createPanel(consoleXT, chartXT),
  createPanel(consoleYT, chartYT),
  createPanel(consoleXY, chartXY)
);

</script>

</body>
</html>
